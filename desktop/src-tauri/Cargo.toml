[package]
name = "dufs-desktop"
version = "1.0.1"
description = "Dufs cross-platform desktop manager"
authors = ["Dufs contributors"]
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "dufs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
if-addrs = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-dialog = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-shell = "2.3"
tauri-plugin-single-instance = "2.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
